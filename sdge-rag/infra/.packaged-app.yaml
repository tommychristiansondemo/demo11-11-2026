        Fn::Sub: sdge-rag-${EnvName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: SPA fallback to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: "function handler(event) {\n  var r = event.request;\n  if (r.uri\
        \ === '/' || r.uri.indexOf('.') === -1) { r.uri = '/index.html'; }\n  return\
        \ r;\n}\n"
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name:
          Fn::Sub: sdge-rag-${EnvName}-security
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy:
              Fn::Sub: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'
                https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;
                img-src 'self' data:; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com
                https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com https://sdge-rag-${EnvName}-docs-${AWS::AccountId}-${AWS::Region}.s3.${AWS::Region}.amazonaws.com;
                frame-ancestors 'none'
  Distribution:
