    Properties:
      Name:
        Fn::Sub: sdge-rag-${EnvName}
      Description: SDGE Gas Ops RAG assistant API
      EndpointConfiguration:
        Types:
        - REGIONAL
      ApiKeySourceType: HEADER
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      RestApiId:
        Ref: RestApi
      Name: cognito
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
      - Fn::GetAtt:
        - UserPool
        - Arn
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: RestApi
      ParentId:
        Fn::GetAtt:
        - RestApi
        - RootResourceId
      PathPart: api
  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
