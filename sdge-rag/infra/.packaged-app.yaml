            - SiteBucket
            - RegionalDomainName
          OriginAccessControlId:
            Fn::GetAtt:
            - SiteOac
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        - Id: api
          DomainName:
            Fn::Sub: ${RestApi}.execute-api.${AWS::Region}.amazonaws.com
          OriginPath:
            Fn::Sub: /${EnvName}
          CustomOriginConfig:
            OriginProtocolPolicy: https-only
            OriginSSLProtocols:
            - TLSv1.2
            OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId:
            Ref: SecurityHeadersPolicy
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - SpaRewriteFunction
              - FunctionMetadata.FunctionARN
        CacheBehaviors:
        - PathPattern: /api/*
          TargetOriginId: api
          ViewerProtocolPolicy: https-only
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - PATCH
          - POST
          - DELETE
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId:
            Ref: SecurityHeadersPolicy
      Tags:
      - Key: app
        Value: sdge-rag
      - Key: env
        Value:
          Ref: EnvName
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: DomainName
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - Distribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  DnsRecordAaaa:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: DomainName
      Type: AAAA
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - Distribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: sdge-rag-${EnvName}-alerts
      DisplayName: SDGE RAG alerts
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
      - Ref: AlertTopic
      PolicyDocument:
        Statement:
        - Sid: AllowCloudWatchAlarms
          Effect: Allow
          Principal:
            Service: cloudwatch.amazonaws.com
          Action: sns:Publish
          Resource:
            Ref: AlertTopic
          Condition:
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*
        - Sid: AllowEventBridge
          Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sns:Publish
          Resource:
            Ref: AlertTopic
          Condition:
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*
  AlertEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn:
        Ref: AlertTopic
      Protocol: email
      Endpoint:
        Ref: AlertEmail
  ApiServiceErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: sdge-rag-${EnvName}-api-service-errors
      AlarmDescription: The Fargate API service is logging errors
      Namespace:
        Fn::Sub: SdgeRag/${EnvName}
      MetricName: ApiErrorLogs
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
      OKActions:
      - Ref: AlertTopic
  IngestFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: sdge-rag-${EnvName}-ingest-failures
      AlarmDescription: A Fargate ingest task failed to index a document
      Namespace:
        Fn::Sub: SdgeRag/${EnvName}
      MetricName: IngestFailures
      Dimensions:
      - Name: Service
        Value: ingest
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  IngestDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: sdge-rag-${EnvName}-ingest-dlq
      AlarmDescription: Ingestion events landed in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - IngestDlq
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: sdge-rag-${EnvName}-api-5xx
      AlarmDescription: API Gateway 5XX responses
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
      - Name: ApiName
        Value:
          Fn::Sub: sdge-rag-${EnvName}
      - Name: Stage
        Value:
          Ref: EnvName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: sdge-rag-${EnvName}-api-latency-p90
      AlarmDescription: p90 API latency above 20s (approaching the 29s integration
        limit)
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
      - Name: ApiName
        Value:
          Fn::Sub: sdge-rag-${EnvName}
      - Name: Stage
        Value:
          Ref: EnvName
      ExtendedStatistic: p90
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  ApiHealthyTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: sdge-rag-${EnvName}-api-no-healthy-tasks
      AlarmDescription: No healthy Fargate API task behind the NLB
      Namespace: AWS/NetworkELB
      MetricName: HealthyHostCount
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - ApiNlb
          - LoadBalancerFullName
      - Name: TargetGroup
        Value:
          Fn::GetAtt:
          - ApiTargetGroup
          - TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
      - Ref: AlertTopic
      OKActions:
      - Ref: AlertTopic
  ErrorLogMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Ref: ApiServiceLogs
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
      - MetricNamespace:
          Fn::Sub: SdgeRag/${EnvName}
        MetricName: ApiErrorLogs
        MetricValue: '1'
        DefaultValue: 0
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: sdge-rag-${EnvName}
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\"type\":\"text\",\"x\":0,\"y\":0,\"width\"\
          :24,\"height\":1,\"properties\":{\"markdown\":\"## SDGE Gas Ops RAG Assistant\
          \ - ${EnvName}\"}},\n    {\"type\":\"metric\",\"x\":0,\"y\":1,\"width\"\
          :8,\"height\":6,\"properties\":{\"title\":\"API requests / errors\",\"region\"\
          :\"${AWS::Region}\",\"stat\":\"Sum\",\"period\":300,\n      \"metrics\"\
          :[[\"AWS/ApiGateway\",\"Count\",\"ApiName\",\"sdge-rag-${EnvName}\",\"Stage\"\
          ,\"${EnvName}\"],[\".\",\"4XXError\",\".\",\".\",\".\",\".\"],[\".\",\"\
          5XXError\",\".\",\".\",\".\",\".\"]]}},\n    {\"type\":\"metric\",\"x\"\
          :8,\"y\":1,\"width\":8,\"height\":6,\"properties\":{\"title\":\"API latency\
          \ (ms)\",\"region\":\"${AWS::Region}\",\"period\":300,\n      \"metrics\"\
          :[[\"AWS/ApiGateway\",\"Latency\",\"ApiName\",\"sdge-rag-${EnvName}\",\"\
          Stage\",\"${EnvName}\",{\"stat\":\"p50\"}],[\"...\",{\"stat\":\"p90\"}],[\"\
          ...\",{\"stat\":\"Maximum\"}]]}},\n    {\"type\":\"metric\",\"x\":16,\"\
          y\":1,\"width\":8,\"height\":6,\"properties\":{\"title\":\"Chat questions\
          \ & tokens\",\"region\":\"${AWS::Region}\",\"stat\":\"Sum\",\"period\":300,\n\
          \      \"metrics\":[[\"SdgeRag/${EnvName}\",\"ChatRequests\",\"Service\"\
          ,\"api\"],[\".\",\"InputTokens\",\".\",\".\"],[\".\",\"OutputTokens\",\"\
          .\",\".\"]]}},\n    {\"type\":\"metric\",\"x\":0,\"y\":7,\"width\":8,\"\
          height\":6,\"properties\":{\"title\":\"Fargate API service CPU / memory\
          \ %\",\"region\":\"${AWS::Region}\",\"stat\":\"Average\",\"period\":60,\n\
          \      \"metrics\":[[\"AWS/ECS\",\"CPUUtilization\",\"ClusterName\",\"${EcsCluster}\"\
          ,\"ServiceName\",\"sdge-rag-${EnvName}-api\"],[\".\",\"MemoryUtilization\"\
          ,\".\",\".\",\".\",\".\"]]}},\n    {\"type\":\"metric\",\"x\":8,\"y\":7,\"\
          width\":8,\"height\":6,\"properties\":{\"title\":\"NLB healthy API tasks\
          \ / errors logged\",\"region\":\"${AWS::Region}\",\"period\":60,\n     \
          \ \"metrics\":[[\"AWS/NetworkELB\",\"HealthyHostCount\",\"TargetGroup\"\
          ,\"${ApiTargetGroup.TargetGroupFullName}\",\"LoadBalancer\",\"${ApiNlb.LoadBalancerFullName}\"\
          ,{\"stat\":\"Minimum\"}],[\"SdgeRag/${EnvName}\",\"ApiErrorLogs\",{\"stat\"\
          :\"Sum\",\"yAxis\":\"right\"}]]}},\n    {\"type\":\"metric\",\"x\":16,\"\
          y\":7,\"width\":8,\"height\":6,\"properties\":{\"title\":\"Docs ingested\
          \ / chunks\",\"region\":\"${AWS::Region}\",\"stat\":\"Sum\",\"period\":300,\n\
          \      \"metrics\":[[\"SdgeRag/${EnvName}\",\"DocumentsIngested\",\"Service\"\
          ,\"ingest\"],[\".\",\"ChunksIndexed\",\".\",\".\"],[\".\",\"IngestFailures\"\
          ,\".\",\".\"]]}},\n    {\"type\":\"metric\",\"x\":0,\"y\":13,\"width\":8,\"\
          height\":6,\"properties\":{\"title\":\"Aurora ACU utilization\",\"region\"\
          :\"${AWS::Region}\",\"stat\":\"Average\",\"period\":300,\n      \"metrics\"\
          :[[\"AWS/RDS\",\"ServerlessDatabaseCapacity\",\"DBClusterIdentifier\",\"\
          sdge-rag-${EnvName}\"],[\".\",\"ACUUtilization\",\".\",\".\"]]}},\n    {\"\
          type\":\"metric\",\"x\":8,\"y\":13,\"width\":8,\"height\":6,\"properties\"\
          :{\"title\":\"Retrieval top score / LLM latency\",\"region\":\"${AWS::Region}\"\
          ,\"period\":300,\n      \"metrics\":[[\"SdgeRag/${EnvName}\",\"RetrievalTopScore\"\
          ,\"Service\",\"api\",{\"stat\":\"Average\"}],[\".\",\"LlmLatencyMs\",\"\
          .\",\".\",{\"stat\":\"p90\",\"yAxis\":\"right\"}]]}},\n    {\"type\":\"\
          log\",\"x\":16,\"y\":13,\"width\":8,\"height\":6,\"properties\":{\"title\"\
          :\"Recent errors\",\"region\":\"${AWS::Region}\",\n      \"query\":\"SOURCE\
          \ '/ecs/sdge-rag-${EnvName}-api' | SOURCE '/ecs/sdge-rag-${EnvName}-ingest'\
          \ | fields @timestamp, message, error | filter level = 'ERROR' | sort @timestamp\
          \ desc | limit 20\",\"view\":\"table\"}}\n  ]\n}\n"
Outputs:
  SiteUrl:
    Value:
      Fn::Sub: https://${DomainName}
  SiteBucketName:
    Value:
      Ref: SiteBucket
  DocsBucketName:
    Value:
      Ref: DocsBucket
  DistributionId:
    Value:
      Ref: Distribution
  DistributionDomain:
    Value:
      Fn::GetAtt:
      - Distribution
      - DomainName
  UserPoolId:
    Value:
      Ref: UserPool
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
  CognitoDomain:
    Value:
      Fn::Sub: ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  SsoProviderName:
    Value:
      Fn::If:
      - HasSaml
      - Ref: SamlProviderName
      - ''
  ApiId:
    Value:
      Ref: RestApi
  ApiKeyId:
    Value:
      Ref: ApiKey
  VpcId:
    Value:
      Ref: Vpc
  TaskSubnetIds:
    Value:
      Fn::Sub: ${PublicSubnetA},${PublicSubnetB}
  EcsClusterName:
    Value:
      Ref: EcsCluster
  EcsClusterArn:
    Value:
      Fn::GetAtt:
      - EcsCluster
      - Arn
  ApiServiceName:
    Value:
      Fn::GetAtt:
      - ApiService
      - Name
  IngestTaskFamily:
    Value:
      Fn::Sub: sdge-rag-${EnvName}-ingest
  IngestSecurityGroupId:
    Value:
      Ref: IngestTaskSecurityGroup
  TaskExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - TaskExecutionRole
      - Arn
  KnowledgeBaseId:
    Value:
      Ref: GasOpsKnowledgeBase
  KnowledgeBaseDataSourceId:
    Value:
      Fn::GetAtt:
      - GasOpsDataSource
      - DataSourceId
  KbVectorBucketName:
    Value:
      Fn::Sub: sdge-rag-${EnvName}-kb-vectors-${AWS::AccountId}
  AppConfigApplicationId:
    Value:
      Ref: AppConfigApplication
  AppConfigEnvironmentId:
    Value:
      Ref: AppConfigEnvironment
  ModelSelectionProfileId:
    Value:
      Ref: ModelSelectionProfile
  AppConfigStrategyId:
    Value:
      Ref: InstantDeploymentStrategy
  ApiInvokeUrl:
    Value:
      Fn::Sub: https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvName}
  DbClusterArn:
    Value:
      Fn::GetAtt:
      - DbCluster
      - DBClusterArn
  DbSecretArn:
    Value:
      Fn::GetAtt:
      - DbCluster
      - MasterUserSecret.SecretArn
  AlertTopicArn:
    Value:
      Ref: AlertTopic
  DashboardUrl:
    Value:
      Fn::Sub: https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=sdge-rag-${EnvName}
