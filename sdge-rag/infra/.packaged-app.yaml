    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: sdge-rag ${EnvName} (${DomainName})
        Aliases:
        - Ref: DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        WebACLId:
