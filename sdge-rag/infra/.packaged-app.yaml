AWSTemplateFormatVersion: '2010-09-09'
Description: "SDGE Gas Ops RAG Assistant - regional APP stack (us-east-2). React SPA\
  \ (S3 + CloudFront), Cognito, API Gateway (REST, usage plan), Lambda (API + ingestion),\
  \ Aurora PostgreSQL Serverless v2 + pgvector (via RDS Data API), Bedrock (Claude\
  \ + Titan Embeddings v2), SSM, Secrets Manager, CloudWatch alarms/dashboard and\
  \ SNS alerting.\n"
Parameters:
  EnvName:
    Type: String
    AllowedValues:
    - dev
    - staging
    - prod
  DomainName:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  CertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 (from the edge stack)
  WebAclArn:
    Type: String
    Description: CLOUDFRONT-scoped WAF web ACL ARN (from the edge stack)
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  DbMinCapacity:
    Type: Number
    Default: 0.5
    Description: Aurora Serverless v2 min ACU (0 enables auto-pause; first query after
      pause is slow)
  DbMaxCapacity:
    Type: Number
    Default: 4
  ApiRateLimit:
    Type: Number
    Default: 20
    Description: Usage plan steady-state requests/second
  ApiBurstLimit:
    Type: Number
    Default: 40
  ApiDailyQuota:
    Type: Number
    Default: 20000
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email subscribed to the SNS alert topic
  SamlMetadataUrl:
    Type: String
    Default: ''
    Description: "Optional SAML 2.0 IdP metadata URL (Entra ID, Okta, ADFS, IAM Identity\
      \ Center). When set, a federated \"Sign in with SSO\" option is enabled.\n"
  SamlProviderName:
    Type: String
    Default: CorporateSSO
  AppImageUri:
    Type: String
    Description: ECR image (repo:content-hash tag) for the API service and ingest
      task, built by scripts/build-images.sh
  ApiDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  LogRetentionDays:
    Type: Number
    Default: 30
Conditions:
  HasAlertEmail:
    Fn::Not:
    - Fn::Equals:
      - Ref: AlertEmail
      - ''
  HasSaml:
    Fn::Not:
    - Fn::Equals:
      - Ref: SamlMetadataUrl
      - ''
  IsProd:
    Fn::Equals:
    - Ref: EnvName
    - prod
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: sdge-rag-${EnvName}
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: sdge-rag-${EnvName}-db-a
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: sdge-rag-${EnvName}-db-b
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value:
          Fn::Sub: sdge-rag-${EnvName}
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: sdge-rag-${EnvName}-tasks-a
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.12.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: sdge-rag-${EnvName}-tasks-b
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
      - Key: Name
        Value:
          Fn::Sub: sdge-rag-${EnvName}-public
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnetA
      RouteTableId:
        Ref: PublicRouteTable
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnetB
      RouteTableId:
        Ref: PublicRouteTable
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription:
        Fn::Sub: sdge-rag ${EnvName} Aurora subnets
      SubnetIds:
      - Ref: SubnetA
      - Ref: SubnetB
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora - no inbound; accessed only through the RDS Data API
      VpcId:
        Ref: Vpc
  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy:
      Fn::If:
      - IsProd
      - Snapshot
      - Delete
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier:
        Fn::Sub: sdge-rag-${EnvName}
      Engine: aurora-postgresql
      EngineVersion: '16.9'
      DatabaseName: ragdb
      MasterUsername: ragadmin
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      StorageEncrypted: true
      DBSubnetGroupName:
        Ref: DbSubnetGroup
      VpcSecurityGroupIds:
      - Ref: DbSecurityGroup
      BackupRetentionPeriod:
        Fn::If:
        - IsProd
        - 7
        - 1
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity:
          Ref: DbMinCapacity
        MaxCapacity:
          Ref: DbMaxCapacity
      Tags:
      - Key: app
        Value: sdge-rag
      - Key: env
        Value:
          Ref: EnvName
  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier:
        Ref: DbCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
  ParamEmbedModel:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /sdge-rag/${EnvName}/embedding-model-id
      Type: String
      Value:
        Ref: EmbeddingModelId
  ParamTopK:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /sdge-rag/${EnvName}/retrieval-top-k
      Type: String
      Value: '6'
  ParamReasoningBudget:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /sdge-rag/${EnvName}/reasoning-budget-tokens
      Type: String
      Description: Extended-thinking budget for chat answers (0 disables; >=1024 enables
        and logs reasoning)
      Value: '1024'
  ParamMaxTokens:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /sdge-rag/${EnvName}/max-output-tokens
      Type: String
      Value: '1200'
  AppConfigApplication:
    Type: AWS::AppConfig::Application
    Properties:
      Name:
        Fn::Sub: sdge-rag-${EnvName}
      Description: Gas Ops Knowledge Assistant runtime configuration
  AppConfigEnvironment:
    Type: AWS::AppConfig::Environment
    Properties:
      ApplicationId:
        Ref: AppConfigApplication
      Name:
        Ref: EnvName
  ModelSelectionProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId:
        Ref: AppConfigApplication
      Name: model-selection
      Description: LLM catalog, quality/cost/latency weights, active model, last evaluation
      LocationUri: hosted
      Type: AWS.Freeform
      Validators:
      - Type: JSON_SCHEMA
        Content: "{\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\n\
          \  \"type\": \"object\",\n  \"required\": [\"weights\", \"activeModelId\"\
          , \"models\"],\n  \"properties\": {\n    \"weights\": {\n      \"type\"\
          : \"object\",\n      \"required\": [\"quality\", \"cost\", \"latency\"],\n\
          \      \"properties\": {\n        \"quality\": {\"type\": \"integer\", \"\
          minimum\": 0, \"maximum\": 100},\n        \"cost\":    {\"type\": \"integer\"\
          , \"minimum\": 0, \"maximum\": 100},\n        \"latency\": {\"type\": \"\
          integer\", \"minimum\": 0, \"maximum\": 100}\n      }\n    },\n    \"activeModelId\"\
          : {\"type\": \"string\", \"minLength\": 3},\n    \"models\": {\n      \"\
          type\": \"array\", \"minItems\": 2,\n      \"items\": {\n        \"type\"\
          : \"object\",\n        \"required\": [\"id\", \"name\", \"vendor\", \"qualityPrior\"\
          , \"pricePer1M\"],\n        \"properties\": {\n          \"qualityPrior\"\
          : {\"type\": \"number\", \"minimum\": 0, \"maximum\": 100},\n          \"\
          pricePer1M\": {\"type\": \"object\", \"required\": [\"input\", \"output\"\
          ]}\n        }\n      }\n    }\n  }\n}\n"
  InstantDeploymentStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Properties:
      Name:
        Fn::Sub: sdge-rag-${EnvName}-instant
      Description: Model Lab changes take effect immediately (no bake time)
      DeploymentDurationInMinutes: 0
      FinalBakeTimeInMinutes: 0
      GrowthFactor: 100
      GrowthType: LINEAR
      ReplicateTo: NONE
  KbVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName:
        Fn::Sub: sdge-rag-${EnvName}-kb-vectors-${AWS::AccountId}
  KbVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn:
        Fn::GetAtt:
        - KbVectorBucket
        - VectorBucketArn
      IndexName: gasops-docs
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
        - AMAZON_BEDROCK_TEXT
        - AMAZON_BEDROCK_METADATA
  KbServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: bedrock.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
      - PolicyName: kb-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: EmbedWithTitanV2
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
          - Sid: ReadDocumentLibrary
            Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:aws:s3:::sdge-rag-${EnvName}-docs-${AWS::AccountId}-${AWS::Region}/uploads/*
          - Sid: ListDocumentLibrary
            Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::Sub: arn:aws:s3:::sdge-rag-${EnvName}-docs-${AWS::AccountId}-${AWS::Region}
            Condition:
              StringLike:
                s3:prefix:
                - uploads/*
                - uploads
          - Sid: VectorIndexReadWrite
            Effect: Allow
            Action:
            - s3vectors:PutVectors
            - s3vectors:GetVectors
            - s3vectors:DeleteVectors
            - s3vectors:QueryVectors
            - s3vectors:ListVectors
            - s3vectors:GetIndex
            Resource:
              Fn::GetAtt:
              - KbVectorIndex
              - IndexArn
  GasOpsKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name:
        Fn::Sub: sdge-rag-${EnvName}-gasops-docs
      Description: Gas Ops document library (managed Bedrock RAG over S3 Vectors)
      RoleArn:
        Fn::GetAtt:
        - KbServiceRole
        - Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn:
            Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: 1024
              EmbeddingDataType: FLOAT32
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn:
            Fn::GetAtt:
            - KbVectorIndex
            - IndexArn
  GasOpsDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId:
        Ref: GasOpsKnowledgeBase
      Name: document-library
      Description: s3://<docs bucket>/uploads/ (the same files the custom pipeline
        indexes)
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn:
            Fn::GetAtt:
            - DocsBucket
            - Arn
          InclusionPrefixes:
          - uploads/
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: sdge-rag-${EnvName}-site-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: SiteBucket
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${SiteBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
        - Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::GetAtt:
            - SiteBucket
            - Arn
          - Fn::Sub: ${SiteBucket.Arn}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: sdge-rag-${EnvName}-docs-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: expire-old-versions
          Status: Enabled
          NoncurrentVersionExpiration:
            NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - Fn::Sub: https://${DomainName}
          AllowedMethods:
          - PUT
          AllowedHeaders:
          - '*'
          MaxAge: 3000
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DocsBucket
      PolicyDocument:
        Statement:
        - Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::GetAtt:
            - DocsBucket
            - Arn
          - Fn::Sub: ${DocsBucket.Arn}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: sdge-rag-${EnvName}
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes: []
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
      - Name: role
        AttributeDataType: String
        Mutable: false
        StringAttributeConstraints:
          MinLength: '1'
          MaxLength: '20'
      LambdaConfig:
        PreSignUp:
          Fn::GetAtt:
          - PreSignUpFunction
          - Arn
        PostConfirmation:
          Fn::GetAtt:
          - PostConfirmationFunction
          - Arn
      UserPoolTags:
        app: sdge-rag
        env:
          Ref: EnvName
  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Ref: UserPool
      GroupName: admins
      Description: Knowledge-base administrators (upload/delete documents)
  EmployeesGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Ref: UserPool
      GroupName: employees
      Description: Employees (ask questions)
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId:
        Ref: UserPool
      Domain:
        Fn::Sub: sdge-rag-${EnvName}-${AWS::AccountId}
  SamlProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasSaml
    Properties:
      UserPoolId:
        Ref: UserPool
      ProviderName:
        Ref: SamlProviderName
      ProviderType: SAML
      ProviderDetails:
        MetadataURL:
          Ref: SamlMetadataUrl
      AttributeMapping:
        email: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
        name: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
    - UserPoolDomain
    Properties:
      UserPoolId:
        Ref: UserPool
      ClientName:
        Fn::Sub: sdge-rag-${EnvName}-spa
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes:
      - name
      - custom:role
      WriteAttributes:
      - name
      - custom:role
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
      - code
      AllowedOAuthScopes:
      - openid
      - email
      - profile
      CallbackURLs:
      - Fn::Sub: https://${DomainName}/
      LogoutURLs:
      - Fn::Sub: https://${DomainName}/
      SupportedIdentityProviders:
        Fn::If:
        - HasSaml
        - - COGNITO
          - Ref: SamlProvider
        - - COGNITO
  LambdaBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
            - ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
      - PolicyName: app
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - rds-data:ExecuteStatement
            - rds-data:BatchExecuteStatement
            - rds-data:BeginTransaction
            - rds-data:CommitTransaction
            - rds-data:RollbackTransaction
            Resource:
              Fn::GetAtt:
              - DbCluster
              - DBClusterArn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::GetAtt:
              - DbCluster
              - MasterUserSecret.SecretArn
          - Effect: Allow
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
            Resource:
              Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdge-rag/${EnvName}/*
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            Resource:
            - arn:aws:bedrock:*::foundation-model/*
            - Fn::Sub: arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
            - s3:DeleteObjectVersion
            - s3:ListBucketVersions
            Resource:
            - Fn::Sub: arn:aws:s3:::sdge-rag-${EnvName}-docs-${AWS::AccountId}-${AWS::Region}
            - Fn::Sub: arn:aws:s3:::sdge-rag-${EnvName}-docs-${AWS::AccountId}-${AWS::Region}/*
          - Sid: PublishCustomMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace:
                  Fn::Sub: SdgeRag/${EnvName}
          - Sid: BedrockKnowledgeBase
            Effect: Allow
            Action:
            - bedrock:Retrieve
            - bedrock:StartIngestionJob
            - bedrock:GetIngestionJob
            - bedrock:ListIngestionJobs
            - bedrock:GetKnowledgeBase
            - bedrock:GetDataSource
            - bedrock:ListDataSources
            Resource:
              Fn::GetAtt:
              - GasOpsKnowledgeBase
              - KnowledgeBaseArn
          - Sid: AppConfigReadLive
            Effect: Allow
            Action:
            - appconfig:StartConfigurationSession
            - appconfig:GetLatestConfiguration
            Resource:
              Fn::Sub: arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${AppConfigApplication}/environment/${AppConfigEnvironment}/configuration/${ModelSelectionProfile}
          - Sid: AppConfigModelLabWrite
            Effect: Allow
            Action:
            - appconfig:ListHostedConfigurationVersions
            - appconfig:GetHostedConfigurationVersion
            - appconfig:CreateHostedConfigurationVersion
            - appconfig:StartDeployment
            - appconfig:GetDeployment
            Resource:
            - Fn::Sub: arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${AppConfigApplication}
            - Fn::Sub: arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${AppConfigApplication}/*
            - Fn::Sub: arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:deploymentstrategy/${InstantDeploymentStrategy}
  PreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: sdge-rag-${EnvName}-presignup
      Runtime: python3.12
      Handler: cognito_triggers.pre_signup
      Code:
        S3Bucket: sdge-rag-artifacts-154833006816-us-east-2
        S3Key: prod/ee96bb94b617ff860b8e3d794a951245
      Role:
        Fn::GetAtt:
        - LambdaBaseRole
        - Arn
      Timeout: 5
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: PreSignUpLogs
  PreSignUpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/sdge-rag-${EnvName}-presignup
      RetentionInDays:
        Ref: LogRetentionDays
  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: PreSignUpFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
  PostConfirmationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  PostConfirmationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: add-to-group
      Roles:
      - Ref: PostConfirmationRole
      PolicyDocument:
        Statement:
        - Effect: Allow
          Action: cognito-idp:AdminAddUserToGroup
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
  PostConfirmationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
