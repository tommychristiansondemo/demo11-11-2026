        Ref: RestApi
      ParentId:
        Ref: ApiResource
      PathPart: '{proxy+}'
  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: RestApi
      ResourceId:
        Ref: ProxyResource
      HttpMethod: ANY
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId:
        Ref: CognitoAuthorizer
      ApiKeyRequired: true
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        ConnectionType: VPC_LINK
        ConnectionId:
          Ref: ApiVpcLink
        Uri:
          Fn::Sub: http://${ApiNlb.DNSName}/api/{proxy}
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy
        TimeoutInMillis: 29000
  GatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: RestApi
      ResponseType: DEFAULT_4XX
      ResponseTemplates:
        application/json: '{"error":"$context.error.messageString","type":"$context.error.responseType","requestId":"$context.requestId"}'
  GatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: RestApi
      ResponseType: DEFAULT_5XX
      ResponseTemplates:
        application/json: '{"error":"$context.error.messageString","type":"$context.error.responseType","requestId":"$context.requestId"}'
  ApiDeploymentV4:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - ProxyMethod
    - GatewayResponse4xx
    - GatewayResponse5xx
    Properties:
      RestApiId:
        Ref: RestApi
      Description: v4 - Fargate via VPC Link
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/apigateway/sdge-rag-${EnvName}-access
      RetentionInDays:
        Ref: LogRetentionDays
  ApiStage:
    Type: AWS::ApiGateway::Stage
    DependsOn: ApiGatewayAccount
    Properties:
      RestApiId:
        Ref: RestApi
      DeploymentId:
        Ref: ApiDeploymentV4
      StageName:
        Ref: EnvName
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn:
          Fn::GetAtt:
          - ApiAccessLogs
          - Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","user":"$context.authorizer.claims.cognito:username","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","integrationLatencyMs":"$context.integrationLatency","apiKeyId":"$context.identity.apiKeyId","error":"$context.error.message"}'
      MethodSettings:
      - ResourcePath: /*
        HttpMethod: '*'
        ThrottlingRateLimit:
          Ref: ApiRateLimit
        ThrottlingBurstLimit:
          Ref: ApiBurstLimit
        MetricsEnabled: true
        LoggingLevel: ERROR
        DataTraceEnabled: false
