  IngestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: sdge-rag-${EnvName}-ingest-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  IngestDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: IngestDlq
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - IngestDlq
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - IngestOnUpload
                - Arn
  EventsRunTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: run-ingest-task
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action: ecs:RunTask
            Resource:
              Fn::Sub: arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/sdge-rag-${EnvName}-ingest:*
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::GetAtt:
                  - EcsCluster
                  - Arn
          - Effect: Allow
            Action: ecs:TagResource
            Resource: '*'
            Condition:
              StringEquals:
                ecs:CreateAction: RunTask
          - Effect: Allow
            Action: iam:PassRole
            Resource:
            - Fn::GetAtt:
              - AppRole
              - Arn
            - Fn::GetAtt:
              - TaskExecutionRole
              - Arn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
  IngestOnUpload:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: sdge-rag-${EnvName}-ingest-on-upload
      Description: New document in s3://docs/uploads/ -> run one Fargate ingest task
      EventPattern:
        source:
        - aws.s3
        detail-type:
        - Object Created
        detail:
          bucket:
            name:
            - Fn::Sub: sdge-rag-${EnvName}-docs-${AWS::AccountId}-${AWS::Region}
          object:
            key:
            - prefix: uploads/
      Targets:
      - Id: ingest-task
        Arn:
          Fn::GetAtt:
          - EcsCluster
          - Arn
        RoleArn:
          Fn::GetAtt:
          - EventsRunTaskRole
          - Arn
        EcsParameters:
          TaskDefinitionArn:
            Ref: IngestTaskDefinition
          TaskCount: 1
          LaunchType: FARGATE
          PlatformVersion: LATEST
          PropagateTags: TASK_DEFINITION
          NetworkConfiguration:
            AwsVpcConfiguration:
              Subnets:
              - Ref: PublicSubnetA
              - Ref: PublicSubnetB
              SecurityGroups:
              - Ref: IngestTaskSecurityGroup
              AssignPublicIp: ENABLED
        InputTransformer:
          InputPathsMap:
            bucket: $.detail.bucket.name
            key: $.detail.object.key
          InputTemplate: "{\"containerOverrides\": [{\"name\": \"ingest\", \"environment\"\
            : [{\"name\": \"S3_BUCKET\", \"value\": <bucket>}, {\"name\": \"S3_KEY\"\
            , \"value\": <key>}]}]}\n"
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - IngestDlq
            - Arn
  DbInitFunction:
